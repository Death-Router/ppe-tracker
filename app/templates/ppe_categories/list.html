{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Категории СИЗ</h1>
    <button class="btn btn-success" title="Добавить" data-bs-toggle="modal" data-bs-target="#createModal"><i class="bi bi-plus-lg"></i></button>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="categories-table">
            <thead class="bg-brand-orange">
            <tr>
                <th>Название</th>
                <th>Описание</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="4" class="text-center text-muted py-4">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно создания -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="create-form">
        <div class="modal-header">
          <h5 class="modal-title">Новая категория</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Название <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="name" required maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea class="form-control" name="description" rows="2" maxlength="500"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Создать</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Модальное окно управления размерами категории -->
<div class="modal fade" id="sizesModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="size-form">
        <input type="hidden" name="category_id" id="size-category-id">
        <div class="modal-header">
          <h5 class="modal-title">Размеры для: <span id="size-category-name"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label class="form-label">Новый размер</label>
                <div class="row g-2">
                    <div class="col-4">
                        <select class="form-select" name="gender">
                            <option value="">Унисекс</option>
                            <option value="М">Мужской</option>
                            <option value="Ж">Женский</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <input type="text" class="form-control" name="size_value" placeholder="Например, 42" required>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary w-100" type="submit">Добавить</button>
                    </div>
                </div>
            </div>
            <ul class="list-group" id="sizes-list">
                <!-- Список размеров -->
            </ul>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/ppe_categories_list.js') }}"></script>

<!-- Модальное окно управления размерами категории -->

        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label class="form-label">Новый размер</label>
                <div class="row g-2">
                    <div class="col-4">
                        <select class="form-select" name="gender">
                            <option value="">Унисекс</option>
                            <option value="М">Мужской</option>
                            <option value="Ж">Женский</option>
                        </select>
                    </div>

                        <input type="text" class="form-control" name="size_value" placeholder="Например, 42" required>

        </div>

    </div>
  </div>
</div>

{% endblock %}
