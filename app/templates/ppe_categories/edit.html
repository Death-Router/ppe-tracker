{# app/templates/ppe_categories/edit.html #}
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Редактирование категории</h1>
            <a href="/ppe-categories" class="btn btn-outline-secondary">← К списку</a>
        </div>

        <div id="conflict-alert" class="alert alert-warning d-none" role="alert">
            Данные устарели, обновите страницу.
            <button type="button" class="btn btn-sm btn-warning ms-2" onclick="location.reload()">Обновить</button>
        </div>

        <form id="category-form" class="card shadow-sm p-4" novalidate>
            <input type="hidden" name="version" id="version" value="">

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="name">Название <span class="text-danger">*</span></label>
                    <input class="form-control" id="name" name="name" required maxlength="100">
                    <div class="invalid-feedback">Укажите название.</div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="description">Описание</label>
                    <textarea class="form-control" id="description" name="description" rows="3" maxlength="500"></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="/ppe-categories" class="btn btn-outline-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary" id="btn-submit">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.CATEGORY_ID = Number("{{ category_id }}");
</script>
<script src="{{ url_for('static', path='js/ppe_category_edit.js') }}"></script>
{% endblock %}
