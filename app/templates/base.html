{# app/templates/base.html #}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title or "Учёт СИЗ" }}{% endblock %}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-purple mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">СИЗ • Учёт</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/employees">Сотрудники</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ppe-categories">Категории СИЗ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ppe-items">Наименования СИЗ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/departments">Подразделения</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/positions">Должности</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/norms">Нормы СИЗ</a>
                </li>


            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>

<!-- Контейнер для toast-уведомлений -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"
     style="z-index: 1100;"></div>

<!-- Bootstrap 5 Bundle (включает Popper) -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

<!-- Хелпер для toast'ов (доступен всем скриптам) -->
<script>
    window.showToast = function (message, variant = 'info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast align-items-center text-bg-${variant} border-0`;
        el.setAttribute('role', 'alert');
        el.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
            </div>`;
        container.appendChild(el);
        const t = new bootstrap.Toast(el, { delay: 4000 });
        t.show();
        el.addEventListener('hidden.bs.toast', () => el.remove());
    };
</script>

<!-- Общие хелперы (API, WebSocket, Forms) -->
<script src="{{ url_for('static', path='js/common/api.js') }}"></script>
<script src="{{ url_for('static', path='js/common/ws.js') }}"></script>
<script src="{{ url_for('static', path='js/common/form.js') }}"></script>

<!-- Блок для скриптов конкретной страницы (каждый шаблон подключает свой) -->
{% block scripts %}{% endblock %}

</body>
</html>
