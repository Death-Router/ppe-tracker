{# app/templates/base.html #}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title or "Учёт СИЗ" }}{% endblock %}</title>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-purple mb-4 shadow-sm navbar-bottom-line">
    <div class="container-fluid">
        <a class="navbar-brand text-brand-orange" href="/settings" title="Настройки" style="font-size: 3rem;">
            <i class="bi bi-gear-fill"></i>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item text-center">
                    <a class="nav-link {% if '/employees' in request.url.path %}active{% endif %}" href="/employees">
                        <i class="bi bi-people d-block" style="font-size: 1.2rem;"></i>
                        <span style="font-size: 0.7rem;">Сотрудники</span>
                    </a>
                </li>
                <li class="nav-item text-center">
                    <a class="nav-link {% if '/ppe' in request.url.path or '/norms' in request.url.path or '/units' in request.url.path %}active{% endif %}" href="/ppe">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1.2rem" height="1.2rem" fill="currentColor" class="d-block mx-auto mb-1"><path d="M208,40H48A16,16,0,0,0,32,56v56c0,54.72,29.8,101.16,79.28,127.56a8.06,8.06,0,0,0,7.44,0C168.2,213.16,208,166.72,208,112V56A16,16,0,0,0,208,40Zm-8,72c0,46.4-24.29,86.24-64,109.33C96.29,198.24,72,158.4,72,112V56H208ZM107.32,135.32a8,8,0,0,1,11.32,0L136,152.69l37.66-37.66a8,8,0,0,1,11.32,11.31l-43.32,43.32a8,8,0,0,1-11.32,0l-23-23A8,8,0,0,1,107.32,135.32Z"/></svg>
                        <span style="font-size: 0.7rem;">СИЗ</span>
                    </a>
                </li>
                <li class="nav-item text-center">
                    <a class="nav-link {% if '/structure' in request.url.path or '/departments' in request.url.path or '/positions' in request.url.path %}active{% endif %}" href="/structure">
                        <i class="bi bi-diagram-3 d-block" style="font-size: 1.2rem;"></i>
                        <span style="font-size: 0.7rem;">Структура</span>
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item text-center">
                    <a class="nav-link" href="#" onclick="event.preventDefault(); fetch('/api/v1/auth/logout', {method: 'POST'}).then(() => window.location.href='/login');">
                        <i class="bi bi-box-arrow-right d-block" style="font-size: 1.2rem;"></i>
                        <span style="font-size: 0.7rem;">Выйти</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>

<!-- Контейнер для toast-уведомлений -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"
     style="z-index: 1100;"></div>

<!-- Bootstrap 5 Bundle (включает Popper) -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

<!-- Хелпер для toast'ов (доступен всем скриптам) -->
<script>
    window.showToast = function (message, variant = 'info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast align-items-center text-bg-${variant} border-0`;
        el.setAttribute('role', 'alert');
        el.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
            </div>`;
        container.appendChild(el);
        const t = new bootstrap.Toast(el, { delay: 4000 });
        t.show();
        el.addEventListener('hidden.bs.toast', () => el.remove());
    };
</script>

<!-- Общие хелперы (API, WebSocket, Forms) -->
<script src="{{ url_for('static', path='js/common/api.js') }}"></script>
<script src="{{ url_for('static', path='js/common/ws.js') }}"></script>
<script src="{{ url_for('static', path='js/common/form.js') }}"></script>

<!-- Блок для скриптов конкретной страницы -->
{% block scripts %}{% endblock %}


<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Ищем только те формы, где явно указан атрибут data-validate="true"
    document.querySelectorAll('form[data-validate="true"]').forEach(form => {
      const submitBtn = form.querySelector('button[type="submit"]');
      if (!submitBtn) return;
      
      const checkValidity = () => {
        submitBtn.disabled = !form.checkValidity();
      };
      
      checkValidity();
      form.addEventListener('input', checkValidity);
      form.addEventListener('change', checkValidity);
    });
  });
</script>


<script>
  // Если страница загружена в iframe, скрываем навбар
  if (window.self !== window.top) {
    const nav = document.querySelector('nav.navbar');
    if (nav) nav.style.display = 'none';
    const main = document.querySelector('main');
    if (main) {
      main.classList.remove('pb-5');
      main.classList.add('pt-3');
    }
  }
</script>


<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Функция для настройки валидации на форме
    function setupFormValidation(form) {
      const submitBtn = form.querySelector('button[type="submit"]');
      if (!submitBtn) return;
      
      const checkValidity = () => {
        submitBtn.disabled = !form.checkValidity();
      };
      
      checkValidity();
      form.addEventListener('input', checkValidity);
      form.addEventListener('change', checkValidity);
    }
    
    // Настраиваем валидацию для всех существующих форм
    document.querySelectorAll('form').forEach(setupFormValidation);
    
    // Следим за появлением новых форм в модалках
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          if (node.nodeType === 1) {
            // Если добавлен элемент form
            if (node.tagName === 'FORM') {
              setupFormValidation(node);
            }
            // Если добавлены элементы внутри формы
            if (node.querySelectorAll) {
              node.querySelectorAll('form').forEach(setupFormValidation);
            }
          }
        });
      });
    });
    
    // Наблюдаем за всем документом
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>

</body>
</html>
