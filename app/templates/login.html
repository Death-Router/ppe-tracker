{% extends "base.html" %}

{% block nav %}{% endblock %}

{% block content %}
<div class="login-screen">
    <div class="login-card">
        <div class="login-card__logo"><i class="bi bi-gear-fill"></i></div>
        <h1 class="login-card__title">Учёт СИЗ</h1>
        <p class="form-text text-center mb-4">Войдите, чтобы продолжить</p>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label" for="username">Имя пользователя</label>
                <input type="text" class="form-control" id="username" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Пароль</label>
                <input type="password" class="form-control" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-brand w-100">Войти</button>
        </form>

        <div id="login-error" class="alert alert-danger d-none mt-3 mb-0" role="alert"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('login-error');

    errorDiv.classList.add('d-none');

    try {
        const resp = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || 'Ошибка входа');

        window.location.href = '/employees';
    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
