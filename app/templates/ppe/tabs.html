{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1 class="page-title">Управление СИЗ</h1>
</div>

<ul class="nav nav-tabs tabs" id="ppeTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="items-tab" data-bs-toggle="tab" data-bs-target="#items"
                type="button" role="tab">СИЗ</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="norms-tab" data-bs-toggle="tab" data-bs-target="#norms"
                type="button" role="tab">Нормы выдачи</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="functions-tab" data-bs-toggle="tab" data-bs-target="#functions"
                type="button" role="tab">Функции СИЗ</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="size-groups-tab" data-bs-toggle="tab" data-bs-target="#size-groups"
                type="button" role="tab">Размерные группы</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="units-tab" data-bs-toggle="tab" data-bs-target="#units"
                type="button" role="tab">Единицы измерения</button>
    </li>
</ul>

<div class="tab-content" id="ppeTabsContent">
    <div class="tab-pane fade show active" id="items" role="tabpanel">
        <iframe class="embed-frame" src="/ppe-items?embedded=1" title="СИЗ"></iframe>
    </div>
    <div class="tab-pane fade" id="norms" role="tabpanel">
        <iframe class="embed-frame" src="/norms?embedded=1" title="Нормы выдачи"></iframe>
    </div>
    <div class="tab-pane fade" id="functions" role="tabpanel">
        <iframe class="embed-frame" src="/ppe-functions?embedded=1" title="Функции СИЗ"></iframe>
    </div>
    <div class="tab-pane fade" id="size-groups" role="tabpanel">
        <iframe class="embed-frame" src="/ppe-size-groups?embedded=1" title="Размерные группы"></iframe>
    </div>
    <div class="tab-pane fade" id="units" role="tabpanel">
        <iframe class="embed-frame" src="/units?embedded=1" title="Единицы измерения"></iframe>
    </div>
</div>
{% endblock %}
