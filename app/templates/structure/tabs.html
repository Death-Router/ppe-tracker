{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <h1 class="page-title">Структура предприятия</h1>
</div>

<ul class="nav nav-tabs tabs" id="structureTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="depts-tab" data-bs-toggle="tab" data-bs-target="#depts"
                type="button" role="tab">Подразделения</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="positions-tab" data-bs-toggle="tab" data-bs-target="#positions"
                type="button" role="tab">Должности</button>
    </li>
</ul>

<div class="tab-content" id="structureTabsContent">
    <div class="tab-pane fade show active" id="depts" role="tabpanel">
        <iframe class="embed-frame" src="/departments?embedded=1" title="Подразделения"></iframe>
    </div>
    <div class="tab-pane fade" id="positions" role="tabpanel">
        <iframe class="embed-frame" src="/positions?embedded=1" title="Должности"></iframe>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Рамка тянется по высоте содержимого — без второй полосы прокрутки
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'embed-height') {
            document.querySelectorAll('.embed-frame').forEach((frame) => {
                if (frame.contentWindow === event.source) {
                    frame.style.height = `${event.data.height + 8}px`;
                }
            });
        }
    });
</script>
{% endblock %}
