{% extends "base.html" %}

{% block content %}
<div class="page-head">
    <a href="/ppe-items" class="btn btn-icon" title="К списку"><i class="bi bi-arrow-left"></i></a>
    <h1 class="page-title">Редактирование наименования</h1>
</div>

<div id="conflict-alert" class="alert alert-warning d-none" role="alert">
    Данные устарели, обновите страницу.
    <button type="button" class="btn btn-sm btn-brand-orange ms-2" onclick="location.reload()">Обновить</button>
</div>

<div class="panel">
    <form data-validate="true" id="item-form" class="panel__body" novalidate>
        <input type="hidden" name="version" id="version" value="">

        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="name">Наименование <span class="req">*</span></label>
                <input class="form-control" id="name" name="name" required maxlength="255">
            </div>
            <div class="col-12">
                <label class="form-label" for="function_id">Функция СИЗ (Защита)</label>
                <select class="form-select" id="function_id" name="function_id">
                    <option value="">Не указана</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="size_group_id">Размерная группа</label>
                <select class="form-select" id="size_group_id" name="size_group_id">
                    <option value="">Не указана</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="unit_id">Единица измерения</label>
                <select class="form-select" id="unit_id" name="unit_id">
                    <option value="">Не указана</option>
                </select>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="/ppe-items" class="btn btn-brand-orange">Отмена</a>
            <button type="submit" class="btn btn-brand" id="btn-submit">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.ITEM_ID = Number("{{ item_id }}");
</script>
<script src="{{ url_for('static', path='js/ppe_item_edit_v2.js') }}"></script>
{% endblock %}
