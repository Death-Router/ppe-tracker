{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h5 mb-0 text-nowrap">Редактирование наименования</h1>
            <a href="/ppe-items" class="btn btn-brand-orange btn-sm">← К списку</a>
        </div>

        <div id="conflict-alert" class="alert alert-warning d-none" role="alert">
            Данные устарели, обновите страницу.
            <button type="button" class="btn btn-sm btn-warning ms-2" onclick="location.reload()">Обновить</button>
        </div>

        <form data-validate="true" id="item-form" class="card shadow-sm p-4" novalidate>
            <input type="hidden" name="version" id="version" value="">

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label" for="name">Наименование <span class="text-danger">*</span></label>
                    <input class="form-control" id="name" name="name" required maxlength="255" spellcheck="false">
                </div>
                <div class="col-12">
                    <label class="form-label" for="function_id">Функция СИЗ (Защита)</label>
                    <select class="form-select" id="function_id" name="function_id">
                        <option value="">Не указана</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label" for="size_group_id">Размерная группа</label>
                    <select class="form-select" id="size_group_id" name="size_group_id">
                        <option value="">Не указана</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label" for="unit_id">Единица измерения</label>
                    <select class="form-select" id="unit_id" name="unit_id">
                        <option value="">Не указана</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="/ppe-items" class="btn btn-brand-orange">Отмена</a>
                <button type="submit" class="btn btn-brand-purple" id="btn-submit">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.ITEM_ID = Number("{{ item_id }}");
</script>
<script src="{{ url_for('static', path='js/ppe_item_edit_v2.js') }}"></script>
{% endblock %}
