{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#createModal" title="Добавить">
        <i class="bi bi-plus-lg"></i>
    </button>
    <h1 class="page-title">Единицы измерения</h1>
</div>

<div class="panel">
    <div class="table-responsive">
        <table class="data-table" id="units-table">
            <thead>
            <tr>
                <th>Название</th>
                <th>Сокращение</th>
                <th class="col-actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="3" class="state">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модалка создания -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="create-form">
                <div class="modal-header">
                    <h5 class="modal-title">Новая единица измерения</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Название <span class="req">*</span></label>
                        <input type="text" class="form-control" name="name" required maxlength="50" placeholder="Например, Пара">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Сокращение <span class="req">*</span></label>
                        <input type="text" class="form-control" name="short_name" required maxlength="10" placeholder="Например, пар">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-brand-orange" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-brand">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/units_list.js') }}"></script>
{% endblock %}
