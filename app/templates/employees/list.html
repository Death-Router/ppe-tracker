{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#createModal" title="Добавить">
        <i class="bi bi-plus-lg"></i>
    </button>
    <h1 class="page-title">Сотрудники</h1>
</div>

<div class="panel">
    <div class="table-responsive">
        <table class="data-table" id="employees-table">
            <thead>
            <tr>
                <th>ФИО</th>
                <th class="col-narrow">Табельный номер</th>
                <th>Подразделение</th>
                <th>Должность</th>
                <th class="col-actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="5" class="state">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модалка создания -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="create-form" data-validate="true">
                <div class="modal-header">
                    <h5 class="modal-title">Новый сотрудник</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Фамилия <span class="req">*</span></label>
                            <input class="form-control" name="last_name" required maxlength="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Имя <span class="req">*</span></label>
                            <input class="form-control" name="first_name" required maxlength="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Отчество</label>
                            <input class="form-control" name="middle_name" maxlength="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Табельный номер <span class="req">*</span></label>
                            <input class="form-control" name="personnel_number" required maxlength="20">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Подразделение <span class="req">*</span></label>
                            <select class="form-select" name="department_id" id="create-dept" required>
                                <option value="">Загрузка...</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Должность <span class="req">*</span></label>
                            <select class="form-select" name="position_id" id="create-pos" required>
                                <option value="">Сначала выберите подразделение</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Дата приема <span class="req">*</span></label>
                            <input type="date" class="form-control" name="hire_date" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Пол <span class="req">*</span></label>
                            <select class="form-select" name="gender" required>
                                <option value="">Не указан</option>
                                <option value="М">Мужской</option>
                                <option value="Ж">Женский</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Рост <span class="req">*</span></label>
                            <input class="form-control" name="height" placeholder="Например, 182" maxlength="10" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-brand-orange" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-brand">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/employees_list.js') }}"></script>
{% endblock %}
