{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <a href="/positions" class="btn btn-icon" title="К списку"><i class="bi bi-arrow-left"></i></a>
    <h1 class="page-title">Редактирование должности</h1>
</div>

<div id="conflict-alert" class="alert alert-warning d-none" role="alert">
    Данные устарели, обновите страницу.
    <button type="button" class="btn btn-sm btn-brand-orange ms-2" onclick="location.reload()">Обновить</button>
</div>

<div class="panel">
    <form data-validate="true" id="pos-form" class="panel__body" novalidate>
        <input type="hidden" name="version" id="version" value="">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label" for="name">Название <span class="req">*</span></label>
                <input class="form-control" id="name" name="name" required maxlength="100">
                <div class="invalid-feedback">Укажите название.</div>
            </div>
            <div class="col-12">
                <label class="form-label" for="department_id">Подразделение <span class="req">*</span></label>
                <select class="form-select" id="department_id" name="department_id" required>
                    <option value="">Загрузка...</option>
                </select>
                <div class="invalid-feedback">Выберите подразделение.</div>
            </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="/positions" class="btn btn-brand-orange">Отмена</a>
            <button type="submit" class="btn btn-brand" id="btn-submit">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.POS_ID = Number("{{ pos_id }}");
</script>
<script src="{{ url_for('static', path='js/position_edit.js') }}"></script>
{% endblock %}
