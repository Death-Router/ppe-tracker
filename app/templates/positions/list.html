{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Должности</h1>
    <button class="btn btn-success" title="Добавить" data-bs-toggle="modal" data-bs-target="#createModal"><i class="bi bi-plus-lg"></i></button>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="positions-table">
            <thead class="bg-brand-orange">
            <tr>
                <th>Название</th>
                <th>Подразделение</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="4" class="text-center text-muted py-4">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно создания -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form data-validate="true" id="create-form">
        <div class="modal-header">
          <h5 class="modal-title">Новая должность</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Название <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="name" required maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Подразделение <span class="text-danger">*</span></label>
            <select class="form-select" name="department_id" id="create-dept" required>
                <option value="">Загрузка...</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-brand-orange" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-brand-purple"><i class="bi bi-plus-lg"></i> Создать</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/positions_list.js') }}"></script>
{% endblock %}
