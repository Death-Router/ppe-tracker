{% extends "base.html" %}
{% from "_tabs.html" import structure_tabs %}
{% block content %}
{# Вкладки раздела #}
{{ structure_tabs('positions') }}

<div class="page-head">
    <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#createModal" title="Добавить">
        <i class="bi bi-plus-lg"></i>
    </button>
    <h1 class="page-title">Должности</h1>
</div>

<div class="filter-bar">
    <div class="input-group filter-bar__search">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" id="search-input" placeholder="Поиск по названию...">
    </div>
</div>

<div class="panel">
    <div class="table-responsive">
        <table class="data-table data-table--dense" id="positions-table">
            <thead>
            <tr>
                <th>Название</th>
                <th>Подразделение</th>
                <th class="col-actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="3" class="state">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pager" id="pager"></div>
</div>

<!-- Модалка создания -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="create-form">
                <div class="modal-header">
                    <h5 class="modal-title">Новая должность</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Название <span class="req">*</span></label>
                        <input type="text" class="form-control" name="name" required maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Подразделение <span class="req">*</span></label>
                        <select class="form-select" name="department_id" id="create-dept" required>
                            <option value="">Загрузка...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-brand-orange" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-brand">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/positions_list.js') }}"></script>
{% endblock %}
