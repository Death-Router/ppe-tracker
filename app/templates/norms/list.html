{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#createNormModal" title="Добавить норму">
        <i class="bi bi-plus-lg"></i>
    </button>
    <h1 class="page-title">Нормы выдачи СИЗ</h1>

    <div class="page-head__spacer"></div>

    <!-- Блок массовых операций (появляется при выборе) -->
    <div id="bulk-actions" class="d-flex align-items-center gap-2 d-none">
        <span class="badge-soft badge-purple">Выбрано: <span id="selected-count">0</span></span>
        <button id="btn-bulk-delete" class="btn btn-icon btn-icon--danger" onclick="bulkDelete()"
                title="Удалить выбранные"><i class="bi bi-trash"></i></button>
    </div>
</div>

<!-- Панель фильтров -->
<div class="filter-bar">
    <div class="input-group filter-bar__search">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" id="search-input" placeholder="Поиск по должности или СИЗ...">
    </div>
    <select class="form-select filter-bar__select" id="filter-position">
        <option value="">Все должности</option>
    </select>
</div>

<!-- Таблица норм -->
<div class="panel">
    <div class="table-responsive">
        <table class="data-table data-table--dense" id="norms-table">
            <thead>
            <tr>
                <th class="col-check"><input type="checkbox" id="select-all" aria-label="Выбрать все"></th>
                <th>Должность</th>
                <th>СИЗ</th>
                <th>Срок износа</th>
                <th>Количество</th>
                <th class="col-actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="6" class="state">Загрузка…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pager" id="pager"></div>
</div>

<!-- Модалка создания/редактирования нормы -->
<div class="modal fade" id="createNormModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="create-norm-form" data-validate="true">
                <div class="modal-header">
                    <h5 class="modal-title">Новая норма выдачи</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Подразделение <span class="req">*</span></label>
                        <select class="form-select" id="modal-department" required>
                            <option value="">Выберите подразделение...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Должность <span class="req">*</span></label>
                        <select class="form-select" name="position_id" id="modal-position" required>
                            <option value="">Сначала выберите подразделение</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">СИЗ <span class="req">*</span></label>
                        <input type="text" class="form-control" list="ppe-items-list" id="norm-item-input"
                               placeholder="Начните вводить название..." required autocomplete="off">
                        <datalist id="ppe-items-list"></datalist>
                        <input type="hidden" name="ppe_item_id" id="norm-item-id">
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Срок (число) <span class="req">*</span></label>
                            <input type="text" class="form-control" name="wear_period_value" required placeholder="Например, 1">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Единица <span class="req">*</span></label>
                            <select class="form-select" name="wear_period_unit" required>
                                <option value="год">год</option>
                                <option value="месяц">месяц</option>
                                <option value="до износа">до износа</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label">Количество <span class="req">*</span></label>
                        <input type="text" class="form-control" name="quantity" required placeholder="Например, 1" value="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-brand-orange" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-brand">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/norms_list.js') }}"></script>
{% endblock %}
