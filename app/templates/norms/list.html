{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Нормы выдачи СИЗ</h1>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <label class="form-label fw-bold">Выберите должность:</label>
        <select class="form-select" id="position-select">
            <option value="">Загрузка должностей...</option>
        </select>
    </div>
</div>

<div id="norms-container" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 text-secondary">Список норм</h5>
        <button class="btn btn-sm btn-success" title="Добавить" data-bs-toggle="modal" data-bs-target="#createNormModal"><i class="bi bi-plus-lg"></i></button>
    </div>
    
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="norms-table">
                <thead class="bg-brand-orange">
                    <tr>
                        <th>СИЗ</th>
                        <th>Срок износа</th>
                        <th>Количество</th>
                        <th class="text-end">Действия</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модальное окно создания нормы -->
<div class="modal fade" id="createNormModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="create-norm-form">
        <div class="modal-header">
          <h5 class="modal-title">Новая норма выдачи</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label class="form-label">Наименование СИЗ <span class="text-danger">*</span></label>
                <select class="form-select" name="ppe_item_id" id="norm-item-select" required>
                    <option value="">Загрузка...</option>
                </select>
            </div>
            <div class="row g-3">
                <div class="col-6">
                    <label class="form-label">Срок (число) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="wear_period_value" required placeholder="Например, 1">
                </div>
                <div class="col-6">
                    <label class="form-label">Единица <span class="text-danger">*</span></label>
                    <select class="form-select" name="wear_period_unit" required>
                        <option value="год">год</option>
                        <option value="месяц">месяц</option>
                        <option value="до износа">до износа</option>
                    </select>
                </div>
            </div>
            <div class="mb-3 mt-3">
                <label class="form-label">Количество <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="quantity" required placeholder="Например, 1 пара" value="1">
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/norms_list.js') }}"></script>
{% endblock %}
