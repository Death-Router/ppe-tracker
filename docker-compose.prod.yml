# Прод-запуск: образ собран из dockerfile.prod, код берётся из образа
# (bind-монтов нет), порт БД наружу не публикуется, api — только на localhost
# (дальше его закрывает reverse-proxy с HTTPS).
#
#   cp .env.prod.example .env.prod      # и заполнить секреты
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# --env-file .env.prod ОБЯЗАТЕЛЕН, а не удобен. Без него у db остаются пустыми
# POSTGRES_USER/PASSWORD/DB: env_file у api кладёт переменные только ВНУТРЬ
# контейнера api, а ${...} в этом файле compose подставляет из .env или из
# --env-file. Пустой POSTGRES_USER = Postgres не создаёт пользователя = db
# unhealthy = "dependency failed to start" без внятной причины.
#
# Миграции в entrypoint по умолчанию не запускаются: прод-база обычно уже
# на голове, а лишний upgrade при каждом старте — лишний риск. Схема с нуля
# собирается (PROJECT.md, ловушка 8 исправлена), поэтому для пустой базы
# достаточно AUTO_MIGRATE=1: entrypoint применит `alembic upgrade head`
# с повторами, дожидаясь готовности БД.
services:
  api:
    build:
      context: .
      dockerfile: dockerfile.prod
    image: ppe-tracker-api:prod
    restart: unless-stopped
    env_file:
      # required: false — чтобы `docker compose config` и `up` не падали, если
      # файла нет: приложение всё равно не стартует без SECRET_KEY, и это
      # сообщение понятнее, чем ошибка compose о ненайденном .env.prod
      - path: .env.prod
        required: false
    environment:
      ENVIRONMENT: production
      # Включать только вместе с HTTPS на прокси: иначе вход не работает
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-0}
    ports:
      # Только локально: 8000 торчит в интернет через reverse-proxy, а не напрямую
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # :? — вместо пустой строки compose остановится и скажет, чего не хватает.
      # По умолчанию значение берётся из .env, поэтому без --env-file .env.prod
      # получится "POSTGRES_USER не задан..." вместо молчаливого blank.
      #
      # ВАЖНО: api берёт эти переменные из env_file (.env.prod), а db — из
      # интерполяции ${...} (то есть из .env или --env-file). Если запустить
      # без --env-file, у api будет пароль из .env.prod, у db — из dev-.env:
      # контейнеры поднимутся, а запросы упадут с
      # «password authentication failed for user "ppe"» и /healthz = 503.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан. Заполните .env.prod и запускайте с --env-file .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан. Заполните .env.prod и запускайте с --env-file .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан. Заполните .env.prod и запускайте с --env-file .env.prod}
    # Порт наружу не публикуем: база нужна только контейнеру api
    volumes:
      # Отдельный том: dev-данные и прод-данные не должны пересекаться
      - ppe_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ppe_prod_pgdata:
