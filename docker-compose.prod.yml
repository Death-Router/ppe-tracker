# Прод-запуск: образ собран из dockerfile.prod, код берётся из образа
# (bind-монтов нет), порт БД наружу не публикуется, api — только на localhost
# (дальше его закрывает reverse-proxy с HTTPS).
#
#   cp .env.prod.example .env.prod      # и заполнить секреты
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api alembic upgrade head
#
# Миграции намеренно не запускаются в entrypoint по умолчанию: схема с нуля
# сейчас не собирается (PROJECT.md, ловушка 8). Флаг AUTO_MIGRATE=1 включает
# их для базы, уже приведённой к голове.
services:
  api:
    build:
      context: .
      dockerfile: dockerfile.prod
    image: ppe-tracker-api:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      # Включать только вместе с HTTPS на прокси: иначе вход не работает
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-0}
    ports:
      # Только локально: 8000 торчит в интернет через reverse-proxy, а не напрямую
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Порт наружу не публикуем: база нужна только контейнеру api
    volumes:
      # Отдельный том: dev-данные и прод-данные не должны пересекаться
      - ppe_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ppe_prod_pgdata:
